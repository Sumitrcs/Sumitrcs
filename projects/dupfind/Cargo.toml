[package]
name = "dupfind"
version = "1.0.0"
edition = "2024"
description = "Find duplicate files fast: size, then a 4 KiB prefix hash, then a full SHA-256 (implemented from scratch), hashed on all CPU cores. Also a sha256sum-compatible hash/check mode."
license = "MIT"
authors = ["Sumit <155360729+Sumitrcs@users.noreply.github.com>"]
repository = "https://github.com/Sumitrcs/dupfind"
keywords = ["duplicates", "sha256", "files", "cli", "dedupe"]
categories = ["command-line-utilities", "filesystem", "cryptography"]

[lib]
name = "dupfind"
path = "src/lib.rs"

[[bin]]
name = "dupfind"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
