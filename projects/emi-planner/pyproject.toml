[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emiplanner"
version = "1.0.0"
description = "Loan EMI planner: amortization schedule, part-prepayments (cut tenure or cut EMI), flat-vs-reducing rate truth, real APR with fees, and affordability."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sumit", email = "155360729+Sumitrcs@users.noreply.github.com" }]
keywords = ["emi", "loan", "amortization", "home-loan", "finance", "india"]

[project.urls]
Homepage = "https://github.com/Sumitrcs/emi-planner"

[project.scripts]
emi = "emiplanner.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["emiplanner"]
