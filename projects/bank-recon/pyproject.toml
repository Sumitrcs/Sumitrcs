[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bankrecon"
version = "1.0.0"
description = "Automatic bank reconciliation for Indian businesses: multi-pass matching (UTR/cheque, date window, fuzzy, split deposits) and a ready Bank Reconciliation Statement."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sumit", email = "155360729+Sumitrcs@users.noreply.github.com" }]
keywords = ["accounting", "bank-reconciliation", "brs", "tally", "finance", "india"]

[project.urls]
Homepage = "https://github.com/Sumitrcs/bank-recon"

[project.scripts]
bankrecon = "bankrecon.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["bankrecon"]
