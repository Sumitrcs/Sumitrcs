[package]
name = "tinyregex"
version = "1.0.0"
edition = "2024"
description = "A regular-expression engine from scratch: parser, Thompson NFA compiler and Pike VM. Linear time, capture groups, no dependencies, plus a small grep."
license = "MIT"
authors = ["Sumit <155360729+Sumitrcs@users.noreply.github.com>"]
repository = "https://github.com/Sumitrcs/tinyregex"
keywords = ["regex", "nfa", "pike-vm", "grep", "learning"]
categories = ["text-processing", "command-line-utilities"]

[lib]
name = "tinyregex"
path = "src/lib.rs"

[[bin]]
name = "tinyregex"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
